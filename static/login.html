<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Agent — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #f6f5f2;
            --bg-card: #ffffff;
            --bg-surface: #f0efe9;
            --bg-hover: #eae9e3;
            --text-primary: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-tertiary: #9a9a9a;
            --border: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.15);
            --amber: #a16207;
            --amber-bg: #fef3d6;
            --radius-md: 10px;
            --radius-lg: 14px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-app: #111110;
                --bg-card: #1c1c1a;
                --bg-surface: #242422;
                --bg-hover: #2e2e2b;
                --text-primary: #e8e8e4;
                --text-secondary: #9a9a94;
                --text-tertiary: #6b6b65;
                --border: rgba(255, 255, 255, 0.07);
                --border-hover: rgba(255, 255, 255, 0.14);
                --amber: #fbbf24;
                --amber-bg: rgba(251, 191, 36, 0.12);
            }
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--bg-app);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            animation: fadeUp 0.4s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-mark {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            background: var(--text-primary);
            color: var(--bg-app);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        h1 {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }
        .google-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 11px 24px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'DM Sans', system-ui, sans-serif;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s, border-color 0.15s;
        }
        .google-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
        }
        .google-btn:active { transform: scale(0.98); }
        .google-icon { width: 18px; height: 18px; }
        .divider {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .disclaimer {
            color: var(--text-tertiary);
            font-size: 12px;
        }
        .paper-badge {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 2px 8px;
            border-radius: 6px;
            background: var(--amber-bg);
            color: var(--amber);
            font-weight: 500;
            vertical-align: middle;
            margin-left: 6px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-mark">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
                <polyline points="16 7 22 7 22 13"/>
            </svg>
        </div>
        <h1>Crypto Agent <span class="paper-badge">paper</span></h1>
        <p class="subtitle">AI-powered paper trading dashboard</p>
        <a href="/auth/google" class="google-btn">
            <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
        </a>
        <div class="divider">
            <p class="disclaimer">Paper trading only — no real funds at risk</p>
        </div>
    </div>
</body>
</html>
